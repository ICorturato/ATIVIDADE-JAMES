
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            font-family:'Poppins',sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .login-box{
            background:white;
            width:400px;
            padding:40px;
            border-radius:20px;
            box-shadow:0 4px 18px rgba(0,0,0,0.08);
        }

        .login-title{
            font-weight:700;
            margin-bottom:10px;
        }

        .login-subtitle{
            color:#6b7280;
            margin-bottom:30px;
        }

        .form-control{
            border-radius:12px;
            padding:12px;
        }

        .btn-login{
            width:100%;
            background:#22c55e;
            border:none;
            color:white;
            padding:12px;
            border-radius:12px;
            font-weight:600;
        }

        .btn-login:hover{
            background:#16a34a;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h2 class="login-title">
        Bem-vindo
    </h2>

    <p class="login-subtitle">
        Faça login para continuar
    </p>

    <form th:action="@{/login}"
          method="post">

        <div class="mb-3">

            <label class="form-label">
                Usuário
            </label>

            <input type="text"
                   name="username"
                   class="form-control"
                   required>

        </div>

        <div class="mb-4">

            <label class="form-label">
                Senha
            </label>

            <input type="password"
                   name="password"
                   class="form-control"
                   required>

        </div>

        <button type="submit"
                class="btn-login">
            Entrar
        </button>

    </form>

</div>

</body>
</html>
